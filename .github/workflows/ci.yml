name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ninguno de los dos jobs escribe al repo, abre PRs ni toca paquetes -
# ambos solo instalan dependencias y corren tests/lint. Sin esto, los jobs
# heredan el permiso default del repo para GITHUB_TOKEN, que puede ser mas
# amplio de lo que hace falta aca.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    # Mismo contenedor que docker-compose.test.yml, pero declarado como
    # "service" de Actions: GitHub lo levanta antes del job y lo tira
    # abajo al terminar. El mapeo 5433:5432 es a proposito - conftest.py
    # tiene el DATABASE_URL de test hardcodeado a localhost:5433 (mismo
    # puerto que se usa en local, para no tener que duplicar esa lectura
    # de env var solo para CI).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: innovalab
          POSTGRES_PASSWORD: innovalab
          POSTGRES_DB: innovalab_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Auditar dependencias (CVEs conocidos)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Correr tests
        working-directory: backend
        run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Correr tests
        working-directory: frontend
        run: npx vitest run
